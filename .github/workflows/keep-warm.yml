name: Keep Render Site Warm

on:
  schedule:
    - cron: '*/1 * * * *'  # every 1 minutes
  workflow_dispatch:        # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Render Website
        run: curl -s https://uday-m-rade-website.onrender.com/ || echo "Ping failed"
